name: Dependency audit

# Scylax itself has no runtime deps; the Python attack surface is inside the
# Docker image (theHarvester, SpiderFoot, Prowler venvs). New CVEs appear
# without code changes, hence the weekly schedule. Kept apart from ci.yml so
# the main pipeline stays fast.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/audit-image-deps.sh
      - scripts/list_venv_deps.py
      - .github/pip-audit-ignore.txt
      - .github/workflows/deps-audit.yml
  pull_request:
    paths:
      - Dockerfile
      - scripts/audit-image-deps.sh
      - scripts/list_venv_deps.py
      - .github/pip-audit-ignore.txt
      - .github/workflows/deps-audit.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Also build and audit the full target (adds Prowler)"
        type: boolean
        default: false

concurrency:
  group: deps-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # full runs on the weekly schedule and on demand; PRs/pushes audit core.
        target: ${{ fromJSON((github.event_name == 'schedule' || inputs.full) && '["core","full"]' || '["core"]') }}
    env:
      PIP_AUDIT_VERSION: "2.10.1"
      # Policy: fail only on findings that have a fixed version available;
      # unfixable ones are reported in the summary. Accepted risks go in
      # .github/pip-audit-ignore.txt.
      FAIL_ON: fixable
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          tags: scylax:${{ matrix.target }}
          load: true
          cache-from: type=gha,scope=audit-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=audit-${{ matrix.target }}
      - name: Install pip-audit
        run: pipx install "pip-audit==${PIP_AUDIT_VERSION}"
      - name: Audit image dependencies
        run: |
          set +e
          scripts/audit-image-deps.sh "scylax:${{ matrix.target }}" audit-out
          rc=$?
          cat audit-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-${{ matrix.target }}
          path: audit-out/
          if-no-files-found: ignore
