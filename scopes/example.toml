# Example scope configuration for the recon pipeline.
# Modeled after the Contoso Ltd. & Northwind Traders multi-domain demonstration environment.
# Copy to scopes/<name>.toml and adjust settings for your organization.
# The filename without extension becomes the scope name (runs/<name>/<date>/).
# Real scope files are git-ignored because they contain sensitive target and authorization info.

[engagement]
engagement = "Contoso Ltd. & Northwind Traders — H2 External Attack Surface Assessment"
scope_owner = "Sarah Jenkins, VP of Information Security (Contoso Ltd.)"

# Authorization is mandatory for active phases (e.g. 3, 4, 4b, 5, 8, A, G, W).
authorised_by = "Sarah Jenkins, VP of Information Security (Contoso Ltd.) - 2026-11-01"
authorisation_ref = "SEC-2026-8841"

# Where runs/<scope>/<date>/ and the finding history are written. Absolute, or
# relative to this scope file. Set it so runs land in the same place wherever you
# launch Scylax from (e.g. a private folder next to the public checkout).
# Leave empty to use <working directory>/runs.
runs_dir = ""

# Optional incoming webhook (Microsoft Teams or any JSON endpoint). After a run,
# new and reappeared high/critical findings are posted to it. Also settable via
# the SCYLAX_ALERT_WEBHOOK environment variable. Leave empty to disable alerts.
alert_webhook = ""

[targets]
# Required: Root domains owned by the organization.
domains = ["contoso.com", "northwindtraders.com", "fabrikam.io"]

# Main website URL for security headers analysis (default: https://www.<first_domain>/).
www_url = "https://www.contoso.com/"

# Automatically discover and add in-scope targets during passive enumeration.
auto_discover_targets = true

# High-Value Target (HVT) IPs: full TCP port scan, service fingerprint, and nuclei scans.
hvt_ips = [
    "198.51.100.10",   # erp-lb.contoso.com (Azure East US)
    "198.51.100.12",   # mail-relay.contoso.com (Exchange Hybrid)
    "198.51.100.15",   # vpn-gw.contoso.com (S2S VPN Gateway)
    "198.51.100.52",   # vm-erp-legacy.contoso.com (Legacy Windows Terminal Server)
    "203.0.113.19",    # ec2-legacy-app.aws.com (Staging API Gateway)
]

# Fragile edge devices (office routers, branch firewalls, IoT): light port scan only, no nuclei.
edge_ips = [
    "198.51.100.90",   # edge-fw01.contoso.com (OPNsense perimeter appliance)
    "203.0.113.45",    # branch-gw45.northwind.net (MikroTik RouterOS edge gateway)
]
edge_ports = "21,22,23,53,80,443,8291"

# IPs strictly excluded from active scanning (third-party hosts, shared PaaS, customer endpoints).
exclude_ips = []

# Ownership allowlist (recommended). When set, auto-discovered IPs are only
# port-scanned / nuclei-scanned if they fall inside these IPs/CIDRs, hvt_ips,
# edge_ips, owned_ips_file or a cloud *_inventory_file. Anything else (CDNs,
# SaaS, shared cloud front-ends) is recorded in osint/skipped_targets.tsv.
owned_ranges = [
    "198.51.100.0/24",
]
# One IP/CIDR per line (first column; '#' comments), e.g. an export of
# `az network public-ip list --query "[].ipAddress" -o tsv`.
# owned_ips_file = "scopes/contoso_owned_ips.txt"

# Organizations trusted to host apex domains (avoids flagging known CDN/SaaS providers as rogue apexes).
apex_trusted_orgs = ["HubSpot", "Cloudflare", "Microsoft Corporation", "Amazon"]

# Organizations/CDNs to skip aggressive port scans for (shared edge / WAF).
skip_portscan_orgs = [
    "Cloudflare",
    "Fastly",
    "Akamai",
    "Amazon CloudFront",
    'cloudfront\.net',  # PTR of CloudFront edges
    "AMAZON-CF",
    "akamaitechnologies",
    "HubSpot",
    "GitHub",
    "Vercel",
    "Netlify",
    "Squarespace",
    "Wix",
]

[azure]
# Phase A (grey-box Azure assessment). Cloud annexes are opt-in: A runs only when
# this section is filled in (or when named explicitly, e.g. -p "A T", which then
# queries every subscription in the active tenant).
# Subscriptions to query via Azure Resource Graph.
azure_subscriptions = [
    "sub-contoso-production-01",
    "sub-contoso-security-01",
    "sub-northwind-analytics-01",
]
# Optional static inventory file: one IP per line (optional TAB + asset name).
azure_inventory_file = ""

[gcp]
# Phase G (grey-box GCP assessment). Opt-in: runs only when this section is filled in or with -p G.
# GCP project IDs to query for external IPs, forwarding rules, and VPC firewalls.
gcp_projects = [
    "contoso-ecommerce-prod",
    "contoso-analytics-prod",
    "contoso-microservices-prod",
]
# Optional static inventory file: one IP per line (optional TAB + asset name).
gcp_inventory_file = ""

[aws]
# Phase W (grey-box AWS assessment). Opt-in: runs only when this section is filled in or with -p W.
# AWS CLI profile names and regions to query for Elastic IPs, ALBs, RDS, and Security Groups.
aws_profiles = ["contoso-security"]
aws_regions = ["us-east-1", "eu-west-1"]
# Optional static inventory file: one IP per line (optional TAB + asset name).
aws_inventory_file = ""

[cloud_posture]
# Cloud Security Posture checks during cloud phases (A: Azure, G: GCP, W: AWS).
# Runs fast native CLI posture checks (Storage public access/encryption, KeyVault purge protection,
# SQL public access, Defender for Cloud tiers, IAM/MFA, VPC firewalls).
cloud_posture = true

# Optional deep CSPM scan using Prowler (CIS benchmarks). Requires 'cloud_posture = true'.
use_prowler = false

[intelligence]
# Optional threat intelligence and breach audit API keys (or export SHODAN_API_KEY / HIBP_API_KEY).
# Shodan: host history & open port lookups (Phase 7). Free public CVEDB lookup runs automatically without a key.
shodan_api_key = ""

# HaveIBeenPwned: enterprise domain breach and leaked account exposure audit (Phase 9).
hibp_api_key = ""

# Passive subdomain sources for Phase 1. Scylax writes these (plus shodan_api_key above) into
# temporary subfinder/amass provider configs for the run and deletes them afterwards, so no
# export is needed. Each key may also come from the upper-cased env var (e.g. VIRUSTOTAL_API_KEY).
# Leave empty to skip a source; all have a free tier.
securitytrails_api_key = ""
virustotal_api_key = ""
binaryedge_api_key = ""
fullhunt_api_key = ""
chaos_api_key = ""            # ProjectDiscovery Chaos
bevigil_api_key = ""
urlscan_api_key = ""
leakix_api_key = ""
netlas_api_key = ""
github_token = ""             # personal access token (public_repo read is enough)
passivetotal_username = ""    # RiskIQ PassiveTotal: account email + API key
passivetotal_api_key = ""
censys_api_id = ""            # subfinder only (amass v5 has no Censys source)
censys_api_secret = ""

# NIST NVD: ~10x higher rate limit for CVE correlation when Shodan CVEDB is unreachable.
nvd_api_key = ""

[content_discovery]
# Phase C: content discovery (optional, opt-in). Actively checks whether paths that
# should not be reachable are exposed — control panels, API docs (Swagger/FastAPI),
# source control, config, backups, telemetry — plus signature-confirmed path
# traversal. Non-intrusive: GET only, rate limited, owned hosts only. Uses gobuster
# when available, else a native probe. Runs only when enabled here or named with -p C.
enabled = false
# Optional custom wordlist (absolute, or relative to this scope file). Empty = the
# bundled curated list (recon/data/content_discovery.txt).
wordlist = ""
# Requests per second per host (native probe and gobuster --delay).
rate = 20

[saas]
# Phase S: SaaS Security Posture checks (Microsoft 365 / Entra ID, GitHub, Google Workspace).
# This phase performs authenticated, read-only configuration audits of the organization's own SaaS tenants,
# separate from the unauthenticated external reconnaissance pipeline.
saas_posture = true
providers = ["m365", "github", "google"]

# Microsoft 365 / Entra ID requirements:
# Environment variables: M365_TENANT_ID, M365_CLIENT_ID, M365_CLIENT_SECRET
# Minimum permissions: Azure AD App Registration with Application permissions:
#   User.Read.All, Directory.Read.All, Policy.Read.All, AuditLog.Read.All,
#   Application.Read.All, Reports.Read.All, UserAuthenticationMethod.Read.All,
#   Organization.Read.All, IdentityRiskyUser.Read.All, IdentityRiskEvent.Read.All
#   (Admin consent granted).

# GitHub requirements:
# Environment variable: GITHUB_ORG
# CLI & auth: GitHub CLI (`gh`) authenticated as organization owner:
#   gh auth refresh --scopes admin:org,audit_log

# Google Workspace requirements:
# CLI & auth: Google Apps Manager (`gam` CLI or GAM_PATH env var) authenticated as super admin:
#   gam info domain

[saas_exposure]
# Phase E (opt-in): anonymous, read-only checks of third-party SaaS tenants named after the organisation
# (Atlassian Cloud: <name>.atlassian.net). Fixed endpoints only; names default to the first label of each public domain.
enabled = false
org_names = []                # extra tenant names to try, e.g. ["contoso-corp"]

[limits]
# Scan rate limits (keep conservative on production networks).
nmap_max_rate = 400           # packets/sec for HVT and cloud scans
edge_max_rate = 40            # packets/sec for fragile edge fingerprinting
nuclei_rate = 50              # requests/sec
httpx_rate = 50               # requests/sec

# Phase 4 service scans also enumerate TLS protocols/ciphers (nmap ssl-enum-ciphers) for the TLS posture
# candidates. Set to false to skip it (faster, fewer handshakes).
tls_enum_ciphers = true

# Amass enumeration settings.
use_amass = true
amass_timeout_min = 10

[thresholds]
# Minimum supported software versions for triage flags. Update per assessment cycle.
min_apache = "2.4.65"
min_nginx = "1.26.0"
min_routeros = "7.15"
